<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gameboy</title>
  <style>
    body {
      margin: 0;
      box-sizing: border-box;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 1px solid #000;
      background-color: white;
    }
    .file-input {
      position: absolute;
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>
  <div class="file-input">
    <input type="file" id="fileInput" accept=".gb,.gbc" />
  </div>
  <main>
    <h1>Gameboy Emulator</h1>
    <div id="screen"></div> <!-- Canvas placeholder -->
    <div id="debug">
      <div>
        <label for="memStart">Mem Start</label>
        <input id="memStart" name="memStart" />
      </div>
      <div>
        <label for="memEnd">Mem End</label>
        <input id="memEnd" name="memEnd" />
      </div>
      <button id="memDump">Dump</button>
    </div>
  </main>
</body>
</html>
